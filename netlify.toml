# Netlify configuration for the Centre de santé Elikya website.
#
# The site is fully static: `npm run build` prerenders the 14 pages (French and /ln Lingala)
# into dist/site-web/browser and writes 404.html. No server or function is needed.
#
# This file sits at the root of the Git repository; the Angular project is in `site-web/`.
# `base` makes Netlify install and build inside site-web; `publish` is relative to `base`.
# In the Netlify UI, leave "Base directory", "Build command" and "Publish directory" empty:
# the values below are used.

[build]
  base = "site-web"
  command = "npm run build"
  publish = "dist/site-web/browser"

[build.environment]
  # Angular 22 requires Node ^22.22.3 or ^24.15.0.
  NODE_VERSION = "22"

# --- Not found pages ----------------------------------------------------------------------
# Netlify serves /404.html (French) automatically for unknown addresses.
# Unknown addresses under /ln/ get the Lingala version instead. These rules only apply when
# no file exists at the requested path (no `force`), so real pages are never affected.
[[redirects]]
  from = "/ln/*"
  to = "/ln/introuvable/index.html"
  status = 404

# --- Caching ------------------------------------------------------------------------------
# Security headers on every file. (No Cache-Control here: Netlify merges headers from all
# matching rules, and its default for pages already revalidates on every visit, so a new
# deploy is visible immediately.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# JavaScript and CSS files have a content hash in their name: cache them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts never change.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and video keep their names when replaced, so a shorter cache (30 days).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
